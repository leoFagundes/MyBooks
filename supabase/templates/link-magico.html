<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; padding: 0; background: #fafaf8">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #fafaf8; padding: 40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 440px; background: #ffffff; border: 1px solid #eaeae6; border-radius: 14px; padding: 32px">
            <tr>
              <td style="font-family: Georgia, 'Times New Roman', serif; font-size: 28px; line-height: 1.2; color: #111110; padding-bottom: 12px">Seu link chegou</td>
            </tr>
            <tr>
              <td style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #6e6e69; padding-bottom: 24px">Toque no botão para entrar na sua estante. O link vale por uma hora e funciona uma vez só.</td>
            </tr>
            <tr>
              <td>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display: inline-block; background: #111110; color: #fafaf8; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 20px; border-radius: 10px">Entrar no MyBooks</a>
              </td>
            </tr>
            <tr>
              <td style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.6; color: #6e6e69; padding-top: 24px">Se não foi você que pediu, pode ignorar este e-mail.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
